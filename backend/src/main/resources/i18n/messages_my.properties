slip.verified=✅ အတည်ပြုပြီးပါပြီ\n\n💰 {0} ဘတ်\n🏦 {2}\n🧾 {3}\n🕐 {1}\n👤 လက်ခံသူ- {4}
slip.amount_mismatch=⚠️ ပမာဏ မကိုက်ညီပါ\n\nစလစ်ပါ ပမာဏ- {0} ဘတ်\nမျှော်လင့်ထားသော- {3} ဘတ်\n🏦 {2}\n🕐 {1}\n\nစစ်ဆေးရန် မှတ်သားထားပါသည်။
slip.receiver_uncertain=⚠️ လက်ခံသူ မသေချာပါ\n\n💰 {0} ဘတ်\n🕐 {1}\n\nငွေလွှဲမှု မှန်ကန်သော်လည်း သင့်အကောင့်သို့ ရောက်ရှိကြောင်း အတည်မပြုနိုင်ပါ။ သင့်ဘဏ်အက်ပ်တွင် စစ်ဆေးပါ။
slip.duplicate=❌ စလစ် ထပ်နေပါသည်\n\n{1} တွင် စစ်ဆေးပြီးဖြစ်ပါသည်။\n🧾 {0}
slip.wrong_receiver=❌ အကောင့် မှားယွင်းနေပါသည်\n\nဤငွေလွှဲမှုသည် သင်မှတ်ပုံတင်ထားသော အကောင့်သို့ မဟုတ်ပါ။
slip.unreadable_qr=⚠️ QR ကုဒ်ကို မဖတ်နိုင်ပါ။\n\nမူရင်းစလစ်ကို ဖိုင်အဖြစ် သို့မဟုတ် မဖြတ်ထားသော screenshot ဖြင့် ပြန်ပို့ပါ။
slip.not_found=❌ စလစ် ရှာမတွေ့ပါ\n\nဤစလစ်နှင့် ကိုက်ညီသော ငွေလွှဲမှု မတွေ့ပါ။ အတုဖြစ်နိုင်သည် သို့မဟုတ် မပြီးစီးသေးပါ။
slip.bank_pending=⏳ ဘဏ်က လုပ်ဆောင်နေဆဲဖြစ်ပါသည်။\n\nခဏအကြာ ပြန်စစ်ပါမည်။
slip.provider_unavailable=⏳ စစ်ဆေးရေးစနစ် အလုပ်များနေပါသည်။\n\nမိနစ်အနည်းငယ်အကြာ ပြန်ကြိုးစားပါ။
slip.quota_exceeded=⚠️ လစဉ် စစ်ဆေးခွင့် ပြည့်သွားပါပြီ။
slip.invalid_image=⚠️ စလစ်ပုံ (JPG သို့မဟုတ် PNG၊ 4 MB အတွင်း) ပို့ပါ။

chat.not_linked=ဤချက်တင်ကို SlipCheck အကောင့်နှင့် မချိတ်ဆက်ရသေးပါ။\n\n1. ဝက်ဘ်ဆိုက်တွင် လော့ဂ်အင်ဝင်ပါ\n2. Settings → Link a chat\n3. ပို့ပါ- /link <code>
chat.linked=✅ {0} နှင့် ချိတ်ဆက်ပြီးပါပြီ။\n\nငွေလွှဲစလစ်ပုံ ပို့ပြီး စစ်ဆေးနိုင်ပါသည်။\nCommand များ- /summary · /lang · /help
chat.unlinked=🔓 ဤချက်တင်ကို {0} မှ ဖြုတ်လိုက်ပါပြီ။\n\nဤနေရာတွင် ပို့သောစလစ်များကို စစ်ဆေးတော့မည် မဟုတ်ပါ။\nပြန်ချိတ်ရန်: Settings → Link a chat → /link <code>
chat.link_failed=❌ ကုဒ်မမှန်ပါ သို့မဟုတ် သက်တမ်းကုန်သွားပါပြီ။\n\nSettings → Link a chat တွင် ကုဒ်အသစ် ပြုလုပ်ပါ။
chat.language_prompt=ဘာသာစကား ရွေးပါ-
chat.language_set=ဘာသာစကားကို မြန်မာဘာသာသို့ ပြောင်းပြီးပါပြီ။
chat.help=Slip ပုံ သို့မဟုတ် ဖိုင်ကို ပို့ပြီး စစ်ဆေးနိုင်ပါသည်။\n\ncaption ထည့်နိုင်သည်- "<ပမာဏ> <နာမည်>"\nဥပမာ "590 Aom"\n\nCommand များ-\n/link <code> — ချက်တင်ချိတ်ဆက်ရန်\n/lang — ဘာသာစကားပြောင်းရန်\n/summary — ယနေ့ အကျဉ်းချုပ်\n/help — ဤမက်ဆေ့ချ်

summary.daily=📊 {0}\n\n✅ အတည်ပြုပြီး: {1} ({2} ဘတ်)\n⚠️ စစ်ဆေးရန်: {3}\n❌ ထပ်နေသော: {4}\n🚫 ပယ်ချထား: {5}
summary.empty=ဒီနေ့ အတွက် တင်သွင်းမှု မရှိသေးပါ။
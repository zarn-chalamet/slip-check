chat.help=Slip ပုံ သို့မဟုတ် ဖိုင်ကို ပို့ပြီး စစ်ဆေးနိုင်ပါသည်။ caption ထည့်နိုင်သည်- "<ပမာဏ> <နာမည်>" ဥပမာ "590 Aom"။ command များ- /link <ကုဒ်> ချက်တင်ချိတ်ဆက်၊ /lang ဘာသာစကားပြောင်း၊ /summary နေ့စဉ်အကျဉ်းချုပ်၊ /help ဤမက်ဆေ့ချ်။

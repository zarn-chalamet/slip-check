slip.verified=✅ အတည်ပြုပြီးပါပြီ။ {1} တွင် ဘတ် {0} လက်ခံရရှိပါသည်။ ဘဏ်- {2}
slip.amount_mismatch=⚠️ စလစ်မှန်ကန်သော်လည်း ပမာဏ ဘတ် {0} သည် မျှော်လင့်ထားသော ဘတ် {3} နှင့် မတူပါ။ စစ်ဆေးရန် မှတ်သားထားပါသည်။
slip.receiver_uncertain=⚠️ ငွေလွှဲမှု မှန်ကန်သော်လည်း (ဘတ် {0}၊ {1}) လက်ခံသူကို အတည်မပြုနိုင်ပါ။ သင့်ဘဏ်အက်ပ်တွင် စစ်ဆေးပါ။
slip.duplicate=❌ ဤစလစ်ကို {1} တွင် အသုံးပြုပြီးဖြစ်ပါသည်။
slip.wrong_receiver=❌ ဤငွေလွှဲမှုသည် မှတ်ပုံတင်ထားသော သင့်အကောင့်သို့ မဟုတ်ပါ။
slip.unreadable_qr=⚠️ QR ကုဒ်ကို မဖတ်နိုင်ပါ။ မူရင်းစလစ်ကို ဖိုင်အဖြစ် သို့မဟုတ် မဖြတ်ထားသော screenshot ဖြင့် ပြန်ပို့ပါ။
slip.not_found=❌ ဤစလစ်နှင့် ကိုက်ညီသော ငွေလွှဲမှု မတွေ့ပါ။ အတုဖြစ်နိုင်သည် သို့မဟုတ် မပြီးစီးသေးပါ။
slip.bank_pending=⏳ ဘဏ်က လုပ်ဆောင်နေဆဲဖြစ်ပါသည်။ ခဏအကြာ ပြန်စစ်ပါမည်။
slip.provider_unavailable=⏳ စစ်ဆေးရေးစနစ် ယာယီ အလုပ်များနေပါသည်။ မိနစ်အနည်းငယ်အကြာ ပြန်ကြိုးစားပါ။
slip.quota_exceeded=⚠️ လစဉ် စစ်ဆေးခွင့် ပြည့်သွားပါပြီ။
slip.invalid_image=⚠️ စလစ်ပုံ (JPG သို့မဟုတ် PNG၊ 4 MB အတွင်း) ပို့ပါ။
chat.not_linked=ဤချက်တင်ကို သင့်အကောင့်နှင့် ချိတ်ဆက်ပါ။ ဝက်ဘ်ဆိုက်တွင် လော့ဂ်အင်ဝင်ပြီး ချိတ်ဆက်ကုဒ်ကို ကူးယူကာ ပို့ပါ- /link 123456
chat.linked=✅ {0} နှင့် ချိတ်ဆက်ပြီးပါပြီ။
chat.link_failed=❌ ကုဒ်မမှန်ပါ သို့မဟုတ် သက်တမ်းကုန်သွားပါပြီ။ ဝက်ဘ်ဆိုက်တွင် ကုဒ်အသစ် ပြုလုပ်ပါ။

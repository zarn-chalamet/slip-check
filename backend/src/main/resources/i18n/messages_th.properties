slip.verified=✅ ยืนยันแล้ว\n\n💰 {0} บาท\n🏦 {2}\n🧾 {3}\n🕐 {1}\n👤 ผู้รับ: {4}
slip.amount_mismatch=⚠️ ยอดเงินไม่ตรง\n\nยอดในสลิป: {0} บาท\nที่คาดไว้: {3} บาท\n🏦 {2}\n🕐 {1}\n\nส่งให้ตรวจสอบแล้ว
slip.receiver_uncertain=⚠️ ยืนยันผู้รับไม่ได้\n\n💰 {0} บาท\n🕐 {1}\n\nการโอนเป็นของจริง แต่ยืนยันไม่ได้ว่าเข้าบัญชีที่ลงทะเบียนไว้หรือไม่ กรุณาตรวจสอบในแอปธนาคาร
slip.duplicate=❌ สลิปซ้ำ\n\nตรวจสอบไปแล้วเมื่อ {1}\n🧾 {0}
slip.wrong_receiver=❌ บัญชีไม่ตรง\n\nการโอนนี้ไม่ได้โอนเข้าบัญชีรับเงินที่ลงทะเบียนไว้
slip.unreadable_qr=⚠️ อ่าน QR code ไม่ได้\n\nกรุณาส่งสลิปต้นฉบับแบบไฟล์ หรือภาพหน้าจอที่ไม่ถูกตัด
slip.not_found=❌ ไม่พบสลิป\n\nไม่พบรายการโอนที่ตรงกับสลิปนี้ อาจเป็นสลิปปลอม หรือรายการยังไม่เสร็จสมบูรณ์
slip.bank_pending=⏳ ธนาคารกำลังดำเนินการ\n\nจะตรวจสอบอีกครั้งในอีกสักครู่
slip.provider_unavailable=⏳ ระบบตรวจสอบไม่ว่าง\n\nกรุณาลองใหม่ในอีกไม่กี่นาที
slip.quota_exceeded=⚠️ ใช้สิทธิ์ตรวจสอบครบตามจำนวนต่อเดือนแล้ว
slip.invalid_image=⚠️ กรุณาส่งรูปสลิป (JPG หรือ PNG ไม่เกิน 4 MB)

chat.welcome=ยินดีต้อนรับสู่ SlipCheck! 🧾✨\nระบบตรวจสอบสลิปโอนเงินอัตโนมัติสำหรับร้านค้าออนไลน์\n\n📌 วิธีเริ่มต้นใช้งาน:\n1️⃣ เชื่อมต่อบัญชีโดยพิมพ์: /link <รหัส>\n2️⃣ ส่งรูปภาพสลิปธนาคารในแชทนี้เพื่อตรวจสอบได้ทันที\n\nพิมพ์ /summary เพื่อดูสรุปยอดขาย หรือ /lang เพื่อเปลี่ยนภาษา
chat.linked=เชื่อมต่อแชทกับร้านค้า "{0}" เรียบร้อยแล้ว! 🎉\n\nคุณสามารถส่งรูปสลิปโอนเงินเข้ามาในแชทนี้เพื่อตรวจสอบความถูกต้องได้ทันทีครับ\n\nคำสั่งที่ใช้งานได้:\n• /summary - ดูสรุปยอดขายประจำวัน\n• /lang - เปลี่ยนภาษาการใช้งาน
chat.not_linked=แชทนี้ยังไม่ได้เชื่อมกับบัญชี SlipCheck\n\n1. เข้าสู่ระบบบนเว็บไซต์\n2. Settings → Link a chat\n3. ส่ง: /link <รหัส>
chat.linked=✅ เชื่อมต่อกับ {0} แล้ว\n\nส่งรูปสลิปเพื่อตรวจสอบการชำระเงิน\nคำสั่ง: /summary · /lang · /help
chat.unlinked=🔓 แชทนี้ถูกยกเลิกการเชื่อมต่อจาก {0} แล้ว\n\nสลิปที่ส่งมาจะไม่ถูกตรวจสอบอีกต่อไป\nเชื่อมใหม่: Settings → Link a chat → /link <รหัส>
chat.link_failed=❌ รหัสไม่ถูกต้องหรือหมดอายุ\n\nกรุณาสร้างรหัสใหม่ในเมนู Settings → Link a chat
chat.language_prompt=เลือกภาษา:
chat.language_set=ตั้งค่าภาษาเป็นไทยแล้ว
chat.help=ส่งรูปหรือไฟล์สลิปธนาคารเพื่อตรวจสอบ\n\nใส่แคปชันได้: "<ยอดเงิน> <ชื่อ>"\nเช่น "590 Aom"\n\nคำสั่ง:\n/link <รหัส> — เชื่อมแชท\n/lang — เปลี่ยนภาษา\n/summary — สรุปยอดวันนี้\n/help — ข้อความนี้

summary.daily=📊 {0}\n\n✅ ยืนยันแล้ว: {1} ({2} บาท)\n⚠️ รอตรวจสอบ: {3}\n❌ สลิปซ้ำ: {4}\n🚫 ปฏิเสธ: {5}
summary.empty=ยังไม่มีรายการวันนี้